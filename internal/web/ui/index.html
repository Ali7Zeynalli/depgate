<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DepGate</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>DepGate</div>
  <div class="meta" id="meta">…</div>
  <div class="actions">
    <button id="lang" class="ghost lang" title="Language">AZ</button>
    <button id="theme" class="ghost" title="Theme" aria-label="Theme"><span class="ticon" aria-hidden="true"></span></button>
    <button id="srcbtn" class="ghost small" hidden>Sources</button>
    <button id="scanall" hidden>Scan all</button>
    <select id="rescan" class="rescan" hidden aria-label="Automatic scan"></select>
    <button id="addproj" class="primary" hidden>+ Add project</button>
    <button id="pwbtn" class="ghost" hidden title="Change password" aria-label="Change password">🔑</button>
    <button id="logout" class="ghost small" hidden>Sign out</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<div id="update" class="updbar" hidden></div>
<div class="layout">
  <nav id="projects" class="projects" aria-label="Projects" hidden></nav>
  <main id="main" class="main">
    <div class="empty">…</div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>

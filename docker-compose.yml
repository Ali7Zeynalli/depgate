# DepGate in Docker
#
#   DEPGATE_UID=$(id -u) DEPGATE_GID=$(id -g) docker compose up -d
#
# Open http://127.0.0.1:7777 (or http://<this machine's IP>:7777 from another
# computer on your network) and set a password on the first visit.
#
# Your home folder is mounted read-only at the SAME path, so the UI shows your
# real paths (/home/you/projects/...) and you can add a project from anywhere in
# your home — no need to move anything. DepGate only reads; it never writes there.
services:
  # one-shot step: makes the data volume belong to your user (also fixes volumes
  # created by older versions), then exits
  depgate-init:
    image: ghcr.io/ali7zeynalli/depgate:latest
    build: .
    user: "0:0"
    command: ["--chown-data", "${DEPGATE_UID:-1000}:${DEPGATE_GID:-1000}"]
    volumes:
      - depgate-data:/data
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  depgate:
    image: ghcr.io/ali7zeynalli/depgate:latest
    build: .
    container_name: depgate
    restart: unless-stopped
    depends_on:
      depgate-init:
        condition: service_completed_successfully
    # run as you, so DepGate can read your files (check with: id -u ; id -g)
    user: "${DEPGATE_UID:-1000}:${DEPGATE_GID:-1000}"
    ports:
      # Open it from this computer (http://127.0.0.1:7777) or from any computer on
      # your network (http://<this machine's IP>:7777) — no settings needed.
      # Connections from the internet are refused by DepGate itself.
      # This computer only: DEPGATE_BIND=127.0.0.1 docker compose up -d
      - "${DEPGATE_BIND:-0.0.0.0}:7777:7777"
    environment:
      # a name instead of an IP (server.lan, or your domain behind an HTTPS proxy); comma separated
      - DEPGATE_ALLOW_HOSTS=${DEPGATE_ALLOW_HOSTS:-}
      - HOME=${HOME}
      - DEPGATE_ROOTS=${HOME}
      # optional: set the password here instead of in the browser (min. 8 characters)
      - DEPGATE_PASSWORD=${DEPGATE_PASSWORD:-}
      # optional: GitHub token (no scopes needed) for release notes beyond 60 requests an hour
      - DEPGATE_GITHUB_TOKEN=${DEPGATE_GITHUB_TOKEN:-}
    volumes:
      # your home, read-only, at the same path
      - ${HOME}:${HOME}:ro
      # project list, reports, password hash, cache — in a Docker volume
      - depgate-data:/data
      # alternative: share the data with a native `depgate` on this machine
      # (run `mkdir -p ~/.config/depgate` first) — replace the line above with:
      # - ${HOME}/.config/depgate:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  depgate-data:

# DepGate in Docker
#
#   docker compose up -d
#
# Open http://127.0.0.1:7777 and set a password on the first visit.
#
# Works the same on Linux, macOS and Windows (Docker Desktop).
#
# Your home folder is mounted read-only — on Linux and macOS at the SAME path,
# so the UI shows your real paths (/home/you/..., /Users/you/...); on Windows
# (no HOME variable) your user folder (C:\Users\you) appears as /host. You can
# add a project from anywhere in it. DepGate only reads; it never writes there.
#
# No user ids to set: the container starts as root only to see who owns your
# home folder, gives that user the data volume, switches to it and drops every
# privilege before it reads anything. (To force another user: DEPGATE_UID / DEPGATE_GID.)
services:
  depgate:
    image: ghcr.io/ali7zeynalli/depgate:latest
    build: .
    container_name: depgate
    restart: unless-stopped
    user: "0:0" # only for the first moment — DepGate switches to the owner of your home folder
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      # Linux/macOS: your home at the same path; Windows: %USERPROFILE% at /host
      - HOME=${HOME:-/host}
      - DEPGATE_ROOTS=${HOME:-/host}
      # optional: run as this user instead of the owner of your home folder
      - DEPGATE_UID=${DEPGATE_UID:-}
      - DEPGATE_GID=${DEPGATE_GID:-}
      # optional: set the password here instead of in the browser (min. 8 characters)
      - DEPGATE_PASSWORD=${DEPGATE_PASSWORD:-}
      # optional: GitHub token (no scopes needed) for release notes beyond 60 requests an hour
      - DEPGATE_GITHUB_TOKEN=${DEPGATE_GITHUB_TOKEN:-}
    volumes:
      # your home, read-only (Linux/macOS: same path; Windows: /host)
      - ${HOME:-${USERPROFILE}}:${HOME:-/host}:ro
      # project list, reports, password hash, cache — in a Docker volume
      - depgate-data:/data
      # alternative: share the data with a native `depgate` on this machine
      # (Linux/macOS; run `mkdir -p ~/.config/depgate` first) — replace the line above with:
      # - ${HOME}/.config/depgate:/data
    read_only: true
    tmpfs:
      - /tmp
    # the few rights needed to hand the data volume to your user and switch to it;
    # all of them are gone once DepGate has switched (it never runs as root)
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
      # SELinux hosts (Fedora, RHEL): lets the container read your home without
      # relabelling it; no effect elsewhere
      - label=disable

volumes:
  depgate-data:

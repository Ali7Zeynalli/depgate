# DepGate in Docker
#
#   DEPGATE_UID=$(id -u) DEPGATE_GID=$(id -g) docker compose up -d
#
# Open http://127.0.0.1:7777 and set a password on the first visit.
#
# Your home folder is mounted read-only at the SAME path, so the UI shows your
# real paths (/home/you/projects/...) and you can add a project from anywhere in
# your home — no need to move anything. DepGate only reads; it never writes there.
services:
  depgate:
    image: ghcr.io/ali7zeynalli/depgate:latest
    build: .
    container_name: depgate
    restart: unless-stopped
    # run as you, so DepGate can read your files (check with: id -u ; id -g)
    user: "${DEPGATE_UID:-1000}:${DEPGATE_GID:-1000}"
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      - HOME=${HOME}
      - DEPGATE_ROOTS=${HOME}
      # optional: set the password here instead of in the browser (min. 8 characters)
      - DEPGATE_PASSWORD=${DEPGATE_PASSWORD:-}
    volumes:
      # your home, read-only, at the same path
      - ${HOME}:${HOME}:ro
      # project list, reports, password hash, cache — in a Docker volume
      - depgate-data:/data
      # alternative: share the data with a native `depgate` on this machine
      # (run `mkdir -p ~/.config/depgate` first) — replace the line above with:
      # - ${HOME}/.config/depgate:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  depgate-data:

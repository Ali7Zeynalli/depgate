name: accuracy
# Compares DepGate with `npm audit` on a project with known-vulnerable
# dependencies, against the live sources. Weekly and on demand; it does not
# block pull requests because it depends on external services.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: DEPGATE_LIVE=1 go test -run TestCompareNpmAudit -v ./internal/scan
